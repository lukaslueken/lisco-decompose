[project]
name = "lisco-decompose"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "casadi==3.7.2",
    "matplotlib==3.10.8",
    "numba==0.66.0",
    "numpy==2.4.2",
    "pandas==2.3.3",
    "scienceplots==2.2.0",
    "torch==2.10.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
